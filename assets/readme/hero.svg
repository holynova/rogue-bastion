<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">坦克要塞 Rogue Bastion — 实时坦克 Roguelike</title>
  <desc id="desc">深钢蓝底卡通像素风标题：坦克要塞，副标题守卫护盾核心，打通 16 层；右侧是战场一角，蓝坦克守着发光的护盾核心，两辆红坦克从上方逼近，砖墙与河流之间炮火来袭。</desc>

  <rect width="1200" height="360" rx="26" fill="#141c22"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#8fa8b8">实时坦克 ROGUELIKE · REAL-TIME TANK ROGUELIKE</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f5c518">坦克要塞</text>
    <text x="56" y="168" font-size="23" fill="#e8ecf4">ROGUE BASTION — 守卫护盾核心，打通 16 层</text>
    <text x="56" y="204" font-size="19" fill="#aab6cc">清剿敌军、拾取强化，第 16 层 Boss 等你。</text>
    <g id="chips" font-size="18" fill="#e8ecf4" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#1e2a33" stroke="#33454f" stroke-width="1.5"/><text x="119" y="262">16 层 + Boss</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#1e2a33" stroke="#33454f" stroke-width="1.5"/><text x="257" y="262">6 种武器</text></g>
      <g><rect x="332" y="238" width="150" height="36" rx="18" fill="#1e2a33" stroke="#33454f" stroke-width="1.5"/><text x="407" y="262">6 种强化</text></g>
      <g><rect x="494" y="238" width="162" height="36" rx="18" fill="#1e2a33" stroke="#33454f" stroke-width="1.5"/><text x="575" y="262">军械库 5×5 级</text></g>
    </g>
  </g>

  <g id="battlefield" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="820" y="40" font-size="18" fill="#8fa8b8">FLOOR 1 · 绿野前线 — 守住核心</text>
    <rect x="820" y="56" width="320" height="240" rx="10" fill="#4d9e4f"/>
    <g id="river"><rect x="820" y="160" width="320" height="28" fill="#3a86c8"/></g>
    <g id="walls" fill="#b4552d">
      <rect x="836" y="72" width="56" height="18" rx="2"/>
      <rect x="1068" y="72" width="56" height="18" rx="2"/>
      <rect x="836" y="212" width="56" height="18" rx="2"/>
      <rect x="1068" y="212" width="56" height="18" rx="2"/>
      <rect x="836" y="120" width="18" height="28" rx="2"/>
      <rect x="1106" y="120" width="18" height="28" rx="2"/>
    </g>
    <g id="bushes" fill="#2e7d32">
      <circle cx="980" cy="128" r="12"/><circle cx="996" cy="122" r="8"/>
      <circle cx="872" cy="252" r="11"/><circle cx="886" cy="246" r="7"/>
    </g>
    <g id="core" transform="translate(980 246)">
      <circle r="22" fill="none" stroke="#7ce7f4" stroke-width="3" opacity="0.9"/>
      <circle r="16" fill="none" stroke="#7ce7f4" stroke-width="2" opacity="0.55"/>
      <rect x="-11" y="-11" width="22" height="22" rx="3" fill="#22d3ee" stroke="#0e7490" stroke-width="2" transform="rotate(45)"/>
      <rect x="-52" y="26" width="104" height="24" rx="12" fill="#16202e" opacity="0.92"/>
      <text y="43" font-size="15" fill="#d9f7ff" text-anchor="middle">护盾 150</text>
    </g>
    <g id="tank-player" transform="translate(936 224)">
      <rect x="-19" y="-13" width="38" height="26" rx="6" fill="#4a90d9" stroke="#16202e" stroke-width="2"/>
      <rect x="-4" y="-24" width="8" height="14" rx="2" fill="#16202e"/>
      <circle cx="0" cy="0" r="9" fill="#3570ad" stroke="#16202e" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#16202e"/>
    </g>
    <g id="tank-enemy-1" transform="translate(900 96)">
      <rect x="-19" y="-13" width="38" height="26" rx="6" fill="#e5484d" stroke="#16202e" stroke-width="2"/>
      <rect x="-4" y="10" width="8" height="14" rx="2" fill="#16202e"/>
      <circle cx="0" cy="0" r="9" fill="#b32f33" stroke="#16202e" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#16202e"/>
    </g>
    <g id="tank-enemy-2" transform="translate(1060 100)">
      <rect x="-19" y="-13" width="38" height="26" rx="6" fill="#e5484d" stroke="#16202e" stroke-width="2"/>
      <rect x="-4" y="10" width="8" height="14" rx="2" fill="#16202e"/>
      <circle cx="0" cy="0" r="9" fill="#b32f33" stroke="#16202e" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#16202e"/>
    </g>
    <g id="bullets" fill="#ffe066">
      <circle cx="936" cy="182" r="5"/>
      <circle cx="936" cy="158" r="4"/>
      <circle cx="900" cy="140" r="4"/>
    </g>
    <rect x="820" y="304" width="320" height="28" rx="8" fill="#1e2a33"/>
    <text x="980" y="323" font-size="15" fill="#c8d6de" text-anchor="middle">第 16 层 Boss · 600 血 · 三向散射</text>
  </g>
</svg>
